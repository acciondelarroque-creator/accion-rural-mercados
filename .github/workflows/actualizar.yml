name: Actualizar mercados BCR

on:
  schedule:
    # Actualización automática a las 11:00 de Argentina, martes, miércoles y viernes.
    # GitHub Actions usa UTC: 14:00 UTC = 11:00 Argentina (UTC-3).
    - cron: "0 14 * * 2,3,5"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

concurrency:
  group: actualizar-mercados-bcr
  cancel-in-progress: false

jobs:
  granos:
    if: github.event_name != 'push' || !contains(github.event.head_commit.message, 'Actualizar mercados BCR')
    runs-on: ubuntu-latest
    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: pip install requests beautifulsoup4

      - name: Obtener precios BCR
        run: python update.py

      - name: Guardar precios BCR
        run: |
          git config user.name "Acción Rural Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json previous.json
          if git diff --cached --quiet; then
            echo "Sin cambios en los precios BCR."
            exit 0
          fi
          git commit -m "Actualizar mercados BCR"
          git pull --rebase origin main
          git push origin HEAD:main
