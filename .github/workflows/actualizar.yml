name: Actualizar mercados locales

on:
  schedule:
    # Cada 30 minutos, lunes a viernes.
    - cron: "*/30 * * * 1-5"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  actualizar:
    runs-on: ubuntu-latest

    steps:
      - name: Descargar repositorio
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.x"

      - name: Instalar dependencias
        run: |
          pip install requests beautifulsoup4

      - name: Obtener precios de granos
        run: python update.py

      - name: Obtener precios MAG Cañuelas
        continue-on-error: true
        run: python update_mag.py

      - name: Guardar precios actualizados
        run: |
          git config user.name "Acción Rural Bot"
          git config user.email "actions@users.noreply.github.com"
          git add data.json previous.json mag.json mag_previous.json
          git diff --cached --quiet || git commit -m "Actualizar mercados locales"
          git push
