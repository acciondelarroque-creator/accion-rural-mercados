<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acción Rural - Mercados</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fff}body{font-family:Arial,sans-serif}.ticker{position:relative;width:100%;height:40px;overflow:hidden;white-space:nowrap;background:#111;color:#eee}.ticker-header{position:absolute;z-index:5;left:0;top:0;width:100px;height:40px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;background:#8F6A2C;border-right:1px solid rgba(255,255,255,.35);box-shadow:7px 0 12px rgba(0,0,0,.35);text-align:left}.ticker-header-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:1}.ticker-header-title{font-size:13px;font-weight:700;color:#fff}.ticker-header-date{font-size:10px;font-weight:700;color:#fff;margin-top:2px}.ticker-window{position:absolute;left:100px;right:0;top:0;height:40px;overflow:hidden;background:#B58A3A}.ticker-track{position:absolute;left:0;top:0;width:100%;height:40px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:pan-x;cursor:grab;background:#B58A3A;padding-left:22px}.ticker-track::-webkit-scrollbar{display:none}.ticker-track.dragging{cursor:grabbing}.ticker-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;height:40px;border-right:1px solid rgba(17,17,17,.28);font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:600;flex:0 0 auto}.ticker-item b{color:#fff}.up{color:#0b6b3a}.down{color:#b51f1f}.flat{color:#eee}.ticker-source-item{display:inline-flex;align-items:center;height:40px;padding:0 20px;font-size:11px;font-weight:600;flex:0 0 auto}.ticker-arrow{position:absolute;z-index:10;top:0;width:38px;height:40px;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;background:transparent;color:#fff}.ticker-arrow.left{left:0}.ticker-arrow.right{right:0}.ticker-arrow span{width:10px;height:10px;border-top:2px solid #fff;border-right:2px solid #fff}.ticker-arrow.left span{transform:rotate(-135deg)}.ticker-arrow.right span{transform:rotate(45deg)}.ticker-arrow.hidden{display:none}@media(max-width:600px){.ticker-header{width:80px;padding:0 9px}.ticker-header-title{font-size:13px}.ticker-header-date{font-size:11px}.ticker-window{left:80px}.ticker-track{padding-left:14px}.ticker-item{padding:0 11px;font-size:13px}.ticker-source-item{padding:0 11px;font-size:10px}.ticker-arrow{width:30px}}</style></head><body><div class="ticker" aria-label="Mercado de granos BCR"><div class="ticker-header"><div class="ticker-header-main"><div class="ticker-header-title">Pizarra</div><div id="bcr-date" class="ticker-header-date">--/--/--</div></div></div><div class="ticker-window"><button id="bcr-arrow-left" class="ticker-arrow left" aria-label="Anterior"><span></span></button><div id="bcr-track" class="ticker-track"></div><button id="bcr-arrow-right" class="ticker-arrow right" aria-label="Siguiente"><span></span></button></div></div><script>const BCR_URL='data.json';const track=document.getElementById('bcr-track'),left=document.getElementById('bcr-arrow-left'),right=document.getElementById('bcr-arrow-right');function shortDate(s){if(!s)return'--/--/--';const p=s.split('/');return p.length===3?p[0]+'/'+p[1]+'/'+p[2].slice(-2):s}function fmt(n){return n==null?'S/C':new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n)}function item(l,v,d){const c=d==null?'':`<span class="${d>0?'up':d<0?'down':'flat'}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d).toFixed(2)}%</span>`;return `<span class="ticker-item"><b>${l}</b> $${fmt(v)}/tn ${c}</span>`}function update(){const max=track.scrollWidth-track.clientWidth;right.classList.toggle('hidden',max<=2||track.scrollLeft>=max-2);left.classList.remove('hidden')}function mover(d){const max=track.scrollWidth-track.clientWidth;const paso=Math.max(220,track.clientWidth*.65);track.scrollTo({left:Math.max(0,Math.min(max,track.scrollLeft+d*paso)),behavior:'smooth'});setTimeout(update,500)}left.onclick=()=>mover(-1);right.onclick=()=>mover(1);track.addEventListener('scroll',update,{passive:true});let down=false,sx=0,ss=0;track.addEventListener('pointerdown',e=>{if(e.pointerType!=='mouse')return;down=true;sx=e.clientX;ss=track.scrollLeft;track.classList.add('dragging')});window.addEventListener('pointermove',e=>{if(!down)return;track.scrollLeft=ss-(e.clientX-sx);e.preventDefault()});window.addEventListener('pointerup',()=>{down=false;track.classList.remove('dragging')});async function load(){try{const r=await fetch(BCR_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();document.getElementById('bcr-date').textContent=shortDate(d.date);track.innerHTML=item('Soja',d.values?.soja,d.changes?.soja)+item('Maíz',d.values?.maiz,d.changes?.maiz)+item('Trigo',d.values?.trigo,d.changes?.trigo)+item('Girasol',d.values?.girasol,d.changes?.girasol)+item('Sorgo',d.values?.sorgo,d.changes?.sorgo)+'<span class="ticker-source-item">Fuente: BCR</span>';track.scrollLeft=0;update()}catch(e){console.error('BCR',e)}}load();setInterval(load,1800000);</script></body></html>
