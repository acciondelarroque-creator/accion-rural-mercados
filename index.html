<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Acción Rural - Mercados de Granos</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fff}
body{font-family:"IBM Plex Sans",Arial,sans-serif}
.ticker{position:relative;width:100%;height:40px;overflow:hidden;white-space:nowrap;background:#111;color:#eee}
.ticker-header{position:absolute;z-index:5;left:0;top:0;width:100px;height:40px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;background:#8F6A2C;border-right:1px solid rgba(255,255,255,.35);box-shadow:7px 0 12px rgba(0,0,0,.35);text-align:left}
.ticker-header-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:.95}
.ticker-header-title,.ticker-header-subtitle{font-size:13px;font-weight:700;color:#fff}.ticker-header-subtitle{margin-top:2px}
.ticker-window{position:absolute;left:100px;right:0;top:0;height:40px;overflow:hidden;background:#B58A3A}
.ticker-track{position:absolute;left:0;top:0;width:100%;height:40px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:none;cursor:grab;background:#B58A3A;padding-left:22px}
.ticker-track::-webkit-scrollbar{display:none}.ticker-track.dragging{cursor:grabbing}
.ticker-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;height:40px;border-right:1px solid rgba(17,17,17,.28);font-size:14px;font-weight:500;letter-spacing:.15px;flex:0 0 auto}
.ticker-item b{color:#fff;font-weight:700}.ticker-label{font-weight:700;color:#fff}
.ticker-label.pizarra,.ticker-label.chicago{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:4px;font-size:11px;font-weight:700;color:#fff;letter-spacing:.35px}
.ticker-label.pizarra{background:#006837}.ticker-label.chicago{background:#234E70}
.up{color:#0b6b3a;font-weight:700}.down{color:#b51f1f;font-weight:700}.flat{color:#eee;font-weight:700}
.ticker-source-item{display:inline-flex;align-items:center;height:40px;padding:0 20px;font-size:10px;font-weight:600;letter-spacing:.2px;flex:0 0 auto}
.ticker-arrow{position:absolute;z-index:10;top:0;width:38px;height:40px;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;background:transparent;color:#fff}
.ticker-arrow.left{left:0}.ticker-arrow.right{right:0}.ticker-arrow span{width:10px;height:10px;border-top:2px solid #fff;border-right:2px solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.65))}
.ticker-arrow.left span{transform:rotate(-135deg)}.ticker-arrow.right span{transform:rotate(45deg)}
@media(max-width:600px){.ticker-header{width:80px;padding:0 9px}.ticker-header-title,.ticker-header-subtitle{font-size:12px}.ticker-window{left:80px}.ticker-track{padding-left:14px}.ticker-item{padding:0 11px;font-size:12.5px}.ticker-label.pizarra,.ticker-label.chicago{height:24px;padding:0 8px;font-size:10px}.ticker-source-item{padding:0 11px;font-size:9px}.ticker-arrow{width:30px}}
</style>
</head>
<body>
<div class="ticker" aria-label="Mercado de Granos">
  <div class="ticker-header"><div class="ticker-header-main"><div class="ticker-header-title">Mercado</div><div class="ticker-header-subtitle">de Granos</div></div></div>
  <div class="ticker-window">
    <button id="bcr-arrow-left" class="ticker-arrow left" aria-label="Anterior"><span></span></button>
    <div id="bcr-track" class="ticker-track"></div>
    <button id="bcr-arrow-right" class="ticker-arrow right" aria-label="Siguiente"><span></span></button>
  </div>
</div>
<script>
const BCR_URL = 'https://raw.githubusercontent.com/acciondelarroque-creator/accion-rural-mercados/main/data.json';
const track = document.getElementById('bcr-track');
const left = document.getElementById('bcr-arrow-left');
const right = document.getElementById('bcr-arrow-right');

function fmtDate(value) {
  return value || '--/--/----';
}
function fmt(value, decimals = 0) {
  if (value === null || value === undefined || value === '') return 'S/C';
  return new Intl.NumberFormat('es-AR', {
    minimumFractionDigits: decimals,
    maximumFractionDigits: decimals
  }).format(value);
}
function variation(value) {
  if (value === null || value === undefined) return '';
  const cls = value > 0 ? 'up' : value < 0 ? 'down' : 'flat';
  const arrow = value > 0 ? '▲' : value < 0 ? '▼' : '=';
  return '<span class="' + cls + '">' + arrow + ' ' + Math.abs(value).toFixed(2) + '%</span>';
}
function localItem(label, value, change) {
  return '<span class="ticker-item"><b>' + label + '</b> $' + fmt(value) + ' /tn ' + variation(change) + '</span>';
}
function chicagoItem(label, value, change) {
  return '<span class="ticker-item"><b>' + label + '</b> US$ ' + fmt(value, 2) + '/tn ' + variation(change) + '</span>';
}
function mover(direction) {
  const max = track.scrollWidth - track.clientWidth;
  const step = Math.max(220, track.clientWidth * 0.65);
  track.scrollTo({
    left: Math.max(0, Math.min(max, track.scrollLeft + direction * step)),
    behavior: 'smooth'
  });
}
left.addEventListener('click', () => mover(-1));
right.addEventListener('click', () => mover(1));

let dragging = false;
let startX = 0;
let startScroll = 0;
track.addEventListener('pointerdown', event => {
  dragging = true;
  startX = event.clientX;
  startScroll = track.scrollLeft;
  track.classList.add('dragging');
  try { track.setPointerCapture(event.pointerId); } catch (_) {}
});
track.addEventListener('pointermove', event => {
  if (!dragging) return;
  track.scrollLeft = startScroll - (event.clientX - startX);
  event.preventDefault();
});
function stopDragging(event) {
  dragging = false;
  track.classList.remove('dragging');
  if (event && event.pointerId !== undefined) {
    try { track.releasePointerCapture(event.pointerId); } catch (_) {}
  }
}
track.addEventListener('pointerup', stopDragging);
track.addEventListener('pointercancel', stopDragging);
track.addEventListener('lostpointercapture', () => stopDragging());

async function loadMarketData() {
  try {
    const response = await fetch(BCR_URL + '?t=' + Date.now(), { cache: 'no-store' });
    if (!response.ok) throw new Error('HTTP ' + response.status);
    const data = await response.json();

    const displayDate = data.date || data.display_date;
    const localChanges = data.changes || {};
    let html = '<span class="ticker-item"><span class="ticker-label pizarra">Pizarra ' +
      fmtDate(displayDate) + '</span></span>';

    html += localItem('Soja', data.values && data.values.soja, localChanges.soja);
    html += localItem('Maíz', data.values && data.values.maiz, localChanges.maiz);
    html += localItem('Trigo', data.values && data.values.trigo, localChanges.trigo);
    html += localItem('Girasol', data.values && data.values.girasol, localChanges.girasol);
    html += localItem('Sorgo', data.values && data.values.sorgo, localChanges.sorgo);

    if (data.chicago && data.chicago.date) {
      html += '<span class="ticker-item"><span class="ticker-label chicago">Chicago cierre ' +
        fmtDate(data.chicago.date) + '</span></span>';
      const values = data.chicago.values || {};
      const changes = data.chicago.changes || {};
      html += chicagoItem('Soja', values.soja, changes.soja);
      html += chicagoItem('Maíz', values.maiz, changes.maiz);
      html += chicagoItem('Trigo', values.trigo, changes.trigo);
    }

    html += '<span class="ticker-source-item">Fuente: BCR / CME Group</span>';
    track.innerHTML = html;
    track.scrollLeft = 0;
  } catch (error) {
    console.error('Mercado de Granos: no se pudieron cargar los datos BCR', error);
    track.innerHTML = '<span class="ticker-item"><b>Mercado de Granos: datos no disponibles</b></span>';
  }
}

loadMarketData();
setInterval(loadMarketData, 30 * 60 * 1000);
</script>
</body>
</html>
