<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acción Rural - Mercados</title>
<style>
*{box-sizing:border-box}
html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fff}
body{font-family:Georgia,"Times New Roman",serif}
.ticker{position:relative;width:100%;overflow:hidden;white-space:nowrap;background:#111;color:#eee;height:40px;line-height:40px}
.ticker-header{position:absolute;z-index:5;left:0;top:0;height:40px;width:126px;display:flex;align-items:center;padding:0 8px;background:#111;border-right:1px solid rgba(255,255,255,.35);box-shadow:7px 0 12px rgba(0,0,0,.28);line-height:normal}
.ticker-header-main{width:100%;display:flex;flex-direction:column;justify-content:center;line-height:1}
.ticker-header-top{display:flex;align-items:baseline;gap:4px;white-space:nowrap}
.ticker-header-title{font-size:9px;font-weight:700;letter-spacing:.2px;color:#fff}
.ticker-header-date{font-size:11px;font-weight:700;color:#fff}
.ticker-header-source{font-size:7px;color:#aaa;margin-top:4px}
.ticker-window{position:absolute;left:126px;right:0;top:0;height:40px;overflow:hidden;touch-action:pan-x;background:#B58A3A}
.ticker-track{position:absolute;left:0;top:0;width:100%;min-width:0;max-width:100%;height:40px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;-webkit-overflow-scrolling:touch;touch-action:pan-x;cursor:grab;background:#B58A3A;padding-left:22px}
.ticker-track::-webkit-scrollbar{display:none}
.ticker-track.dragging{cursor:grabbing}
.ticker-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;height:40px;border-right:1px solid rgba(17,17,17,.28);font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:600;flex:0 0 auto}
.ticker-item b{color:#fff}
.ticker-item .up{color:#0b6b3a}
.ticker-item .down{color:#b51f1f}
.ticker-item .muted{color:#eee;font-size:11px}
.ticker-arrow{position:absolute;z-index:6;top:0;width:38px;height:40px;display:flex;align-items:center;justify-content:center;pointer-events:none;background:linear-gradient(to right,rgba(181,138,58,.96),rgba(181,138,58,0));color:#fff;font-family:Arial,sans-serif;font-size:23px;line-height:1;opacity:1;transition:opacity .25s}
.ticker-arrow.left{left:0;background:linear-gradient(to right,#B58A3A,rgba(181,138,58,.92),rgba(181,138,58,0))}
.ticker-arrow.right{right:0;background:linear-gradient(to left,#B58A3A,rgba(181,138,58,.92),rgba(181,138,58,0))}
.ticker-arrow span{display:block;line-height:1;font-size:23px;font-family:Arial,sans-serif;font-weight:400;transform:translateY(0)}
.ticker-arrow.left span{animation:slideHintLeft 1.5s ease-in-out infinite}
.ticker-arrow.right span{animation:slideHint 1.5s ease-in-out infinite}
@keyframes slideHint{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(6px);opacity:1}}
@keyframes slideHintLeft{0%,100%{transform:translateX(0);opacity:.55}50%{transform:translateX(-6px);opacity:1}}
.ticker-arrow.hidden{opacity:0}
@media(min-width:601px){.ticker-header{width:150px}.ticker-window{left:150px}.ticker-arrow{width:38px}.ticker-header-title{font-size:15px}.ticker-header-date{font-size:11px}.ticker-header-source{font-size:10px;margin-top:3px}}
@media(max-width:600px){.ticker-header{width:126px;height:40px;padding:0 8px}.ticker-window{left:126px;height:40px}.ticker-track{height:40px;padding-left:22px}.ticker-item{height:40px;padding:0 14px;font-size:12px;gap:6px}.ticker-arrow{height:40px;width:38px;font-size:23px}.ticker-arrow span{font-size:23px}.ticker-header-title{font-size:12px}.ticker-header-date{font-size:10px}.ticker-header-source{font-size:9px;margin-top:3px}}
</style>
</head>
<body>
<div id="bcr" class="ticker" aria-label="Mercado de granos BCR">
<div class="ticker-header"><div class="ticker-header-main"><div class="ticker-header-top"><div class="ticker-header-title">Pizarra:</div><div id="bcr-date" class="ticker-header-date">--/--/--</div></div><div class="ticker-header-source">Fuente: BCR</div></div></div>
<div class="ticker-window" id="bcr-window"><div id="bcr-arrow-left" class="ticker-arrow left hidden"><span>←</span></div><div id="bcr-track" class="ticker-track"></div><div id="bcr-arrow-right" class="ticker-arrow right"><span>→</span></div></div>
</div>
<script>
const BCR_URL='data.json';
function shortDate(s){if(!s)return'--/--/--';const p=s.split('/');return p.length===3?p[0]+'/'+p[1]+'/'+p[2].slice(-2):s}
function fmt(n){return n==null?'S/C':new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n)}
function bcrItem(label,value,delta){const variation=delta==null?'':`<span class="${delta>0?'up':delta<0?'down':''}">${delta>0?'▲':delta<0?'▼':'='} ${Math.abs(delta).toFixed(2)}%</span>`;return `<span class="ticker-item"><b>${label}</b> $${fmt(value)}/tn ${variation}</span>`}
function renderBCR(d){document.getElementById('bcr-date').textContent=shortDate(d.date);let html='';html+=bcrItem('Soja',d.values?.soja,d.changes?.soja);html+=bcrItem('Maíz',d.values?.maiz,d.changes?.maiz);html+=bcrItem('Trigo',d.values?.trigo,d.changes?.trigo);html+=bcrItem('Girasol',d.values?.girasol,d.changes?.girasol);html+=bcrItem('Sorgo',d.values?.sorgo,d.changes?.sorgo);const track=document.getElementById('bcr-track');track.innerHTML=html;track.scrollLeft=0;updateArrows()}
function updateArrows(){const track=document.getElementById('bcr-track');const left=document.getElementById('bcr-arrow-left');const right=document.getElementById('bcr-arrow-right');const canScroll=track.scrollWidth>track.clientWidth+5;left.classList.toggle('hidden',!canScroll);right.classList.toggle('hidden',!canScroll)}
async function loadBCR(){try{const r=await fetch(BCR_URL+'?t='+Date.now(),{cache:'no-store'});if(r.ok)renderBCR(await r.json())}catch(e){console.error('BCR:',e)}}
const track=document.getElementById('bcr-track');track.addEventListener('scroll',updateArrows,{passive:true});window.addEventListener('resize',updateArrows);let isDown=false,startX=0,startScroll=0;track.addEventListener('mousedown',e=>{isDown=true;track.classList.add('dragging');startX=e.pageX;startScroll=track.scrollLeft});window.addEventListener('mouseup',()=>{isDown=false;track.classList.remove('dragging')});track.addEventListener('mousemove',e=>{if(!isDown)return;e.preventDefault();track.scrollLeft=startScroll-(e.pageX-startX)});loadBCR();setInterval(loadBCR,1800000);
</script>
</body>
</html>
