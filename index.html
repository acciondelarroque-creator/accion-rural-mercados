<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Acción Rural - Mercados</title>
<style>
*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fff}body{font-family:Georgia,"Times New Roman",serif}.ticker{position:relative;width:100%;overflow:hidden;white-space:nowrap;background:#111;color:#eee;height:42px;line-height:42px}.ticker-track{position:absolute;left:0;top:0;display:flex;width:max-content;min-width:max-content}.ticker-item{display:inline-flex;align-items:center;gap:8px;padding:0 22px;font-family:Georgia,"Times New Roman",serif;font-size:15px;font-weight:600;flex:none}.ticker-item .crop-icon{width:20px;height:20px;display:inline-flex;align-items:center;justify-content:center;flex:none}.ticker-item .crop-icon svg{width:20px;height:20px;display:block}.ticker-item .up{color:#20c878}.ticker-item .down{color:#ff3b30}.ticker-item .muted{color:#aaa;font-size:12px}.mag-ticker{position:relative;margin-top:0;background:#173f60;color:#fff;height:68px;overflow:hidden}.mag-track{position:absolute;left:0;top:0;display:flex;width:max-content;min-width:max-content}.mag-card{min-width:170px;height:68px;padding:9px 18px;border-right:1px solid rgba(255,255,255,.25);text-align:center;font-family:Georgia,"Times New Roman",serif;flex:none}.mag-title{font-size:14px;font-weight:700;display:block}.mag-value{font-size:16px;margin-top:4px;display:block}.mag-date{min-width:190px}.mag-date small{display:block;color:#cbd7e2;font-size:10px;margin-top:4px}.mag-group{min-width:180px}.mag-index{min-width:190px}@media(max-width:600px){.ticker{height:36px;line-height:36px}.ticker-item{padding:0 14px;font-size:12px}.ticker-item .crop-icon{width:17px;height:17px}.ticker-item .crop-icon svg{width:17px;height:17px}.mag-ticker{height:58px}.mag-card{min-width:135px;height:58px;padding:7px 10px}.mag-title{font-size:11px}.mag-value{font-size:13px;margin-top:3px}.mag-date{min-width:150px}.mag-group{min-width:145px}.mag-index{min-width:155px}.mag-date small{font-size:9px;margin-top:2px}}
</style>
</head>
<body>
<div id="bcr" class="ticker" aria-label="Mercado de granos BCR"><div id="bcr-track" class="ticker-track"></div></div>
<div id="mag" class="mag-ticker" aria-label="Mercado Agroganadero de Cañuelas"><div id="mag-track" class="mag-track"></div></div>
<script>
const BCR_URL='data.json',MAG_URL='mag.json';let bcrTimer=null,magTimer=null;
function fmt(n){return n==null?'S/C':new Intl.NumberFormat('es-AR',{maximumFractionDigits:0}).format(n)}
function fmtIndex(n){return n==null?'S/C':Number(n).toLocaleString('es-AR',{minimumFractionDigits:3,maximumFractionDigits:3})}
const cropIcons={
 soja:'<svg viewBox="0 0 24 24" aria-hidden="true"><ellipse cx="9" cy="8" rx="4.2" ry="5.6" fill="#d8b64a" transform="rotate(-25 9 8)"/><ellipse cx="15" cy="8" rx="4.2" ry="5.6" fill="#c9a63d" transform="rotate(25 15 8)"/><ellipse cx="9" cy="16" rx="4.2" ry="5.6" fill="#e2c45a" transform="rotate(25 9 16)"/><ellipse cx="15" cy="16" rx="4.2" ry="5.6" fill="#d3ae45" transform="rotate(-25 15 16)"/></svg>',
 maiz:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M7 3c2 3 2 6 2 9 0 4-1 6-2 9" fill="none" stroke="#e2c21b" stroke-width="3" stroke-linecap="round"/><path d="M17 3c-2 3-2 6-2 9 0 4 1 6 2 9" fill="none" stroke="#f0cf29" stroke-width="3" stroke-linecap="round"/><path d="M5 7c5 2 9 2 14 0M5 12c5 2 9 2 14 0M5 17c5 2 9 2 14 0" stroke="#b99716" stroke-width="1.4"/><path d="M8 20c-3 0-5 1-6 3M16 20c3 0 5 1 6 3" fill="none" stroke="#4d9b45" stroke-width="2" stroke-linecap="round"/></svg>',
 trigo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V4" stroke="#d7bd43" stroke-width="2"/><path d="M12 7C8 6 7 4 7 2M12 10C8 9 6 7 6 5M12 13C16 12 18 10 18 8M12 16C8 15 6 13 6 11M12 19C16 18 18 16 18 14" fill="none" stroke="#e1c34a" stroke-width="2" stroke-linecap="round"/></svg>',
 girasol:'<svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="11" r="3.5" fill="#6b4a19"/><g fill="#f3cf24"><ellipse cx="12" cy="4" rx="2" ry="4"/><ellipse cx="12" cy="18" rx="2" ry="4"/><ellipse cx="5" cy="11" rx="4" ry="2"/><ellipse cx="19" cy="11" rx="4" ry="2"/><ellipse cx="7" cy="6" rx="2" ry="4" transform="rotate(-45 7 6)"/><ellipse cx="17" cy="6" rx="2" ry="4" transform="rotate(45 17 6)"/><ellipse cx="7" cy="16" rx="2" ry="4" transform="rotate(45 7 16)"/><ellipse cx="17" cy="16" rx="2" ry="4" transform="rotate(-45 17 16)"/></g><path d="M12 15v8" stroke="#4d9b45" stroke-width="2"/><path d="M12 19c-3-2-4-2-6-1M12 19c3-2 4-2 6-1" fill="none" stroke="#4d9b45" stroke-width="2"/></svg>',
 sorgo:'<svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 22V8" stroke="#5c9b43" stroke-width="2"/><path d="M12 9C8 7 7 5 8 3c2 0 4 1 4 3 0-2 2-4 4-4 1 2-1 4-4 6 4-1 6 0 7 2-2 2-4 2-7 1 3 1 4 3 3 5-2 0-3-2-3-4 0 2-2 4-4 4-1-2 0-4 4-6-4 1-6 0-7-2 2-2 4-2 7-1z" fill="#a6b83d"/></svg>'
};
function bcrItem(label,value,delta,icon){return `<span class="ticker-item"><span class="crop-icon" aria-hidden="true">${cropIcons[icon]}</span><b>${label}</b> $${fmt(value)}/tn ${delta==null?'':`<span class="${delta>0?'up':delta<0?'down':''}">${delta>0?'▲':delta<0?'▼':'='} ${Math.abs(delta).toFixed(2)}%</span>`}</span>`}
function renderBCR(d){let html='';html+=bcrItem('Soja',d.values.soja,d.changes.soja,'soja');html+=bcrItem('Maíz',d.values.maiz,d.changes.maiz,'maiz');html+=bcrItem('Trigo',d.values.trigo,d.changes.trigo,'trigo');html+=bcrItem('Girasol',d.values.girasol,d.changes.girasol,'girasol');html+=bcrItem('Sorgo',d.values.sorgo,d.changes.sorgo,'sorgo');html+=`<span class="ticker-item"><b>Pizarra: ${d.date||''}</b> <span class="muted">Fuente BCR</span></span>`;const track=document.getElementById('bcr-track');track.innerHTML=html+html;startTicker(track,'bcr')}
function magGroup(label,value){const mostrado=value==null?'S/C':`$${Number(value).toLocaleString('es-AR',{minimumFractionDigits:0,maximumFractionDigits:0})}/kg`;return `<span class="mag-card mag-group"><span class="mag-title">${label}</span><span class="mag-value">${mostrado}</span></span>`}
function indexCard(label,value){return `<span class="mag-card mag-index"><span class="mag-title">${label}</span><span class="mag-value">${fmtIndex(value)}</span></span>`}
function renderMAG(d){let html=`<span class="mag-card mag-date"><span class="mag-title">MAG CAÑUELAS</span><span class="mag-value">${d.date||''}</span><small>Guarino Producciones</small></span><span class="mag-card"><span class="mag-title">Cabezas</span><span class="mag-value">${fmt(d.heads)}</span></span>`;const g=d.group_values||{};html+=magGroup('Novillos',g.NOVILLOS);html+=magGroup('Novillitos',g.NOVILLITOS);html+=magGroup('Vaquillonas',g.VAQUILLONAS);html+=magGroup('Vacas',g.VACAS);html+=magGroup('Toros',g.TOROS);if(d.indices){html+=indexCard('INMAG – Novillo',d.indices.inmag_novillo);html+=indexCard('IGMAG – General',d.indices.igmag_general);html+=indexCard('Índice de Arrendamiento',d.indices.arrendamiento)}const track=document.getElementById('mag-track');track.innerHTML=html+html;startTicker(track,'mag')}
function startTicker(track,type){if(type==='bcr'&&bcrTimer)clearInterval(bcrTimer);if(type==='mag'&&magTimer)clearInterval(magTimer);track.style.left='0px';setTimeout(function(){const half=track.scrollWidth/2;if(!half)return;const speed=type==='bcr'?0.7:0.8;let x=0;const tick=function(){x-=speed;if(x<=-half)x+=half;track.style.left=Math.round(x*10)/10+'px'};const timer=setInterval(tick,16);if(type==='bcr')bcrTimer=timer;else magTimer=timer},50)}
async function loadBCR(){try{const r=await fetch(BCR_URL+'?t='+Date.now(),{cache:'no-store'});if(r.ok)renderBCR(await r.json())}catch(e){console.error('BCR:',e)}}
async function loadMAG(){try{const r=await fetch(MAG_URL+'?t='+Date.now(),{cache:'no-store'});if(r.ok){renderMAG(await r.json());return}}catch(e){console.error('MAG:',e)}
renderMAG({date:'21/08/2026',heads:5889,group_values:{NOVILLOS:4533.33,NOVILLITOS:4933.33,VAQUILLONAS:4833.33,VACAS:3500,TOROS:3300},indices:{inmag_novillo:4312.21,igmag_general:3680.25,arrendamiento:4372.88}})}
loadBCR();loadMAG();setInterval(loadBCR,1800000);setInterval(loadMAG,1800000);
</script>
</body>
</html>
