<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Acción Rural - Mercados</title>
<style>
* { box-sizing: border-box; }
html, body { margin: 0; padding: 0; background: #111; font-family: Arial, Helvetica, sans-serif; }
.marquesina { width: 100%; height: 40px; background: #111; display: flex; align-items: center; overflow: hidden; color: #fff; border-bottom: 1px solid #222; }
.ventana { width: 100%; height: 40px; overflow: hidden; position: relative; white-space: nowrap; }
.pista { height: 40px; position: absolute; left: 0; top: 0; display: flex; align-items: center; white-space: nowrap; }
.item { display: inline-flex; align-items: center; padding: 0 18px; color: #fff; font-size: 13px; font-weight: 600; }
.producto { color: #8bd0a0; font-weight: 700; margin-right: 7px; }
.separador { color: #666; margin-left: 18px; }
.fecha { color: #fff; font-size: 14px; font-weight: 700; margin-left: 10px; }
.estado { color: #aaa; font-size: 12px; padding-left: 18px; }
.cambio { font-size: 13px; font-weight: 800; margin-left: 7px; }
.subio { color: #20c878; }
.bajo { color: #ff3b30; }
.igual { color: #aaa; }
.fuente { color: #aaa; font-size: 11px; font-weight: 500; margin-left: 8px; }
.seccion { color: #fff; font-weight: 800; font-size: 13px; letter-spacing: .2px; }
.bcr { background: #111; }
.mag { background: #172b3a; }
.mag .producto { color: #a8d8bb; }
.mag .seccion { color: #fff; }
@keyframes correrBcr { from { transform: translateX(0); } to { transform: translateX(-33.333333%); } }
@keyframes correrMag { from { transform: translateX(0); } to { transform: translateX(-33.333333%); } }
.marquesina:hover .pista { animation-play-state: paused; }
@media (max-width: 600px) {
.marquesina, .ventana, .pista { height: 36px; }
.item { padding: 0 12px; font-size: 11px; }
.fecha { font-size: 12px; }
.cambio { font-size: 11px; margin-left: 5px; }
.fuente { font-size: 10px; }
.seccion { font-size: 11px; }
}
</style>
</head>
<body>

<!-- MARQUESINA 1: MERCADO DE GRANOS / BCR -->
<div id="marquesina-bcr" class="marquesina bcr">
  <div class="ventana">
    <div class="pista" id="pista-bcr"><span class="estado">Actualizando Mercado de Granos...</span></div>
  </div>
</div>

<!-- MARQUESINA 2: MAG CAÑUELAS -->
<div id="marquesina-mag" class="marquesina mag">
  <div class="ventana">
    <div class="pista" id="pista-mag"><span class="estado">Actualizando MAG Cañuelas...</span></div>
  </div>
</div>

<script>
(function () {
  const pistaBcr = document.getElementById("pista-bcr");
  const pistaMag = document.getElementById("pista-mag");

  function precio(valor, unidad) {
    if (valor === null || valor === undefined) return "S/C";
    return "$" + Number(valor).toLocaleString("es-AR") + unidad;
  }

  function cambio(valor) {
    if (valor === null || valor === undefined) return "";
    if (valor > 0) return '<span class="cambio subio">▲ ' + Math.abs(valor).toFixed(2).replace('.', ',') + '%</span>';
    if (valor < 0) return '<span class="cambio bajo">▼ ' + Math.abs(valor).toFixed(2).replace('.', ',') + '%</span>';
    return '<span class="cambio igual">= 0,00%</span>';
  }

  function cabezas(valor) {
    return Number(valor || 0).toLocaleString("es-AR");
  }

  function iniciar(pista, html, duracion) {
    pista.innerHTML = html + html + html;
    pista.style.animation = "none";
    void pista.offsetWidth;
    pista.style.animation = duracion + "s linear infinite";
  }

  function mostrarBcr(datos) {
    const productos = [
      ["soja", "Soja"],
      ["maiz", "Maíz"],
      ["trigo", "Trigo"],
      ["girasol", "Girasol"],
      ["sorgo", "Sorgo"]
    ];

    let html = '<span class="item"><span class="seccion">MERCADO DE GRANOS</span></span>';

    productos.forEach(function (producto) {
      const clave = producto[0];
      const nombre = producto[1];
      html += '<span class="item"><span class="producto">' + nombre + '</span><span>' + precio(datos.values[clave], '/tn') + '</span>' + cambio(datos.changes ? datos.changes[clave] : null) + '<span class="separador">●</span></span>';
    });

    if (datos.date) {
      html += '<span class="item"><span class="fecha">Pizarra: ' + datos.date + '</span><span class="fuente">Fuente BCR</span></span>';
    }

    iniciar(pistaBcr, html, 31);
  }

  function mostrarMag(mag) {
    const categorias = [
      ["novillos", "Novillos"],
      ["novillitos", "Novillitos"],
      ["vaquillonas", "Vaquillonas"],
      ["vacas", "Vacas"],
      ["toros", "Toros"]
    ];

    let html = '<span class="item"><span class="seccion">MAG CAÑUELAS</span></span>';

    categorias.forEach(function (categoria) {
      const clave = categoria[0];
      const nombre = categoria[1];
      html += '<span class="item"><span class="producto">' + nombre + '</span><span>' + precio(mag.values[clave], '/kg') + '</span>' + cambio(mag.changes ? mag.changes[clave] : null) + '<span class="separador">●</span></span>';
    });

    if (mag.heads !== undefined && mag.heads !== null) {
      html += '<span class="item"><span class="producto">Cabezas</span><span>' + cabezas(mag.heads) + '</span><span class="separador">●</span></span>';
    }

    if (mag.date) {
      html += '<span class="item"><span class="fecha">Rueda: ' + mag.date + '</span><span class="fuente">Fuente MAG</span></span>';
    }

    iniciar(pistaMag, html, 31);
  }

  function actualizarBcr() {
    fetch("data.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("No se pudo obtener data.json");
        return r.json();
      })
      .then(mostrarBcr)
      .catch(function (error) {
        console.log("Acción Rural BCR:", error);
      });
  }

  function actualizarMag() {
    fetch("mag.json?v=" + Date.now(), { cache: "no-store" })
      .then(function (r) {
        if (!r.ok) throw new Error("No se pudo obtener mag.json");
        return r.json();
      })
      .then(mostrarMag)
      .catch(function (error) {
        console.log("Acción Rural MAG:", error);
      });
  }

  actualizarBcr();
  actualizarMag();

  // Cada fuente se actualiza por separado cada 30 minutos.
  setInterval(actualizarBcr, 30 * 60 * 1000);
  setInterval(actualizarMag, 30 * 60 * 1000);
})();
</script>
</body>
</html>
