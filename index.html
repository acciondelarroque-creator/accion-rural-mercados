<!doctype html><html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Acción Rural - Mercados de Granos</title><style>*{box-sizing:border-box}html,body{margin:0;padding:0;width:100%;overflow:hidden;background:#fff}body{font-family:"IBM Plex Sans",Arial,sans-serif}.ticker{position:relative;width:100%;height:40px;overflow:hidden;white-space:nowrap;background:#111;color:#eee}.ticker-header{position:absolute;z-index:5;left:0;top:0;width:100px;height:40px;display:flex;align-items:center;justify-content:flex-start;padding:0 8px;background:#8F6A2C;border-right:1px solid rgba(255,255,255,.35);box-shadow:7px 0 12px rgba(0,0,0,.35);text-align:left}.ticker-header-main{display:flex;flex-direction:column;align-items:flex-start;justify-content:center;line-height:.95}.ticker-header-title{font-size:13px;font-weight:700;color:#fff}.ticker-header-subtitle{font-size:13px;font-weight:700;color:#fff;margin-top:2px}.ticker-window{position:absolute;left:100px;right:0;top:0;height:40px;overflow:hidden;background:#B58A3A}.ticker-track{position:absolute;left:0;top:0;width:100%;height:40px;display:flex;align-items:center;overflow-x:auto;overflow-y:hidden;scrollbar-width:none;touch-action:none;cursor:grab;background:#B58A3A;padding-left:22px}.ticker-track::-webkit-scrollbar{display:none}.ticker-track.dragging{cursor:grabbing}.ticker-item{display:inline-flex;align-items:center;gap:7px;padding:0 20px;height:40px;border-right:1px solid rgba(17,17,17,.28);font-family:"IBM Plex Sans",Arial,sans-serif;font-size:14px;font-weight:500;letter-spacing:.15px;flex:0 0 auto}.ticker-item b{color:#fff;font-weight:700}.ticker-label{font-weight:700;color:#fff}.ticker-label.pizarra,.ticker-label.chicago{display:inline-flex;align-items:center;height:26px;padding:0 10px;border-radius:4px;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:11px;font-weight:700;color:#fff;letter-spacing:.35px;text-transform:none}.ticker-label.pizarra{background:#006837}.ticker-label.chicago{background:#234E70}.up{color:#0b6b3a;font-weight:700}.down{color:#b51f1f;font-weight:700}.flat{color:#eee;font-weight:700}.ticker-source-item{display:inline-flex;align-items:center;height:40px;padding:0 20px;font-family:"IBM Plex Sans",Arial,sans-serif;font-size:10px;font-weight:600;letter-spacing:.2px;flex:0 0 auto}.ticker-arrow{position:absolute;z-index:10;top:0;width:38px;height:40px;border:0;padding:0;display:flex;align-items:center;justify-content:center;cursor:pointer;pointer-events:auto;background:transparent;color:#fff}.ticker-arrow.left{left:0}.ticker-arrow.right{right:0}.ticker-arrow:hover{background:transparent}.ticker-arrow:active{background:transparent}.ticker-arrow span{width:10px;height:10px;border-top:2px solid #fff;border-right:2px solid #fff;filter:drop-shadow(0 0 2px rgba(0,0,0,.65))}.ticker-arrow.left span{transform:rotate(-135deg)}.ticker-arrow.right span{transform:rotate(45deg)}@media(max-width:600px){.ticker-header{width:80px;padding:0 9px}.ticker-header-title,.ticker-header-subtitle{font-size:12px}.ticker-window{left:80px}.ticker-track{padding-left:14px}.ticker-item{padding:0 11px;font-size:12.5px}.ticker-label.pizarra,.ticker-label.chicago{height:24px;padding:0 8px;font-size:10px}.ticker-source-item{padding:0 11px;font-size:9px}.ticker-arrow{width:30px}}</style></head><body><div class="ticker" aria-label="Mercado de Granos"><div class="ticker-header"><div class="ticker-header-main"><div class="ticker-header-title">Mercado</div><div class="ticker-header-subtitle">de Granos</div></div></div><div class="ticker-window"><button id="bcr-arrow-left" class="ticker-arrow left" aria-label="Anterior"><span></span></button><div id="bcr-track" class="ticker-track"></div><button id="bcr-arrow-right" class="ticker-arrow right" aria-label="Siguiente"><span></span></button></div></div><script>const BCR_URL='data.json';const track=document.getElementById('bcr-track'),left=document.getElementById('bcr-arrow-left'),right=document.getElementById('bcr-arrow-right');function fmtDate(s){if(!s)return'--/--/----';return s}function fmt(n,dec=0){return n==null?'S/C':new Intl.NumberFormat('es-AR',{minimumFractionDigits:dec,maximumFractionDigits:dec}).format(n)}function variation(d){if(d==null)return'';return `<span class="${d>0?'up':d<0?'down':'flat'}">${d>0?'▲':d<0?'▼':'='} ${Math.abs(d).toFixed(2)}%</span>`}function localItem(l,v,d){return `<span class="ticker-item"><b>${l}</b> $${fmt(v)}/tn ${variation(d)}</span>`}function chicagoItem(l,v,d){return `<span class="ticker-item"><b>${l}</b> US$ ${fmt(v,2)}/tn ${variation(d)}</span>`}function mover(d){const max=track.scrollWidth-track.clientWidth;const paso=Math.max(220,track.clientWidth*.65);track.scrollTo({left:Math.max(0,Math.min(max,track.scrollLeft+d*paso)),behavior:'smooth'})}left.onclick=()=>mover(-1);right.onclick=()=>mover(1);let down=false,sx=0,ss=0;track.addEventListener('pointerdown',e=>{if(e.target.closest('.ticker-arrow'))return;down=true;sx=e.clientX;ss=track.scrollLeft;track.classList.add('dragging');try{track.setPointerCapture(e.pointerId)}catch(_){} });track.addEventListener('pointermove',e=>{if(!down)return;track.scrollLeft=ss-(e.clientX-sx);e.preventDefault()});track.addEventListener('pointerup',e=>{down=false;track.classList.remove('dragging');try{track.releasePointerCapture(e.pointerId)}catch(_){} });track.addEventListener('pointercancel',()=>{down=false;track.classList.remove('dragging')});async function load(){try{const r=await fetch(BCR_URL+'?t='+Date.now(),{cache:'no-store'});if(!r.ok)throw Error(r.status);const d=await r.json();let html=`<span class="ticker-item"><span class="ticker-label pizarra">Pizarra ${fmtDate(d.date)}</span></span>`;html+=localItem('Soja',d.values?.soja,d.changes?.soja)+localItem('Maíz',d.values?.maiz,d.changes?.maiz)+localItem('Trigo',d.values?.trigo,d.changes?.trigo)+localItem('Girasol',d.values?.girasol,d.changes?.girasol)+localItem('Sorgo',d.values?.sorgo,d.changes?.sorgo);if(d.chicago?.date){html+=`<span class="ticker-item"><span class="ticker-label chicago">Chicago cierre ${fmtDate(d.chicago.date)}</span></span>`;html+=chicagoItem('Soja',d.chicago.values?.soja,d.chicago.changes?.soja)+chicagoItem('Maíz',d.chicago.values?.maiz,d.chicago.changes?.maiz)+chicagoItem('Trigo',d.chicago.values?.trigo,d.chicago.changes?.trigo)}html+='<span class="ticker-source-item">Fuente: BCR</span>';track.innerHTML=html;track.scrollLeft=0}catch(e){console.error('Mercado de Granos',e)}}load();setInterval(load,1800000);</script></body></html>
